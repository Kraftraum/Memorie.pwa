<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memory – 36 Karten</title>

<!-- PWA Meta -->
<meta name="theme-color" content="#0f0c29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memory">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
    --accent:#f5c518;
  }
  html{font-size:16px}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:#fff;overflow-x:hidden;padding:1rem;
    -webkit-user-select:none;user-select:none;
  }

  /* ── Header ── */
  header{text-align:center;margin-bottom:1rem}
  h1{
    font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;
    background:linear-gradient(90deg,#f5c518,#ff6b6b,#f5c518);
    background-size:200%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmer 3s linear infinite;
    margin-bottom:.4rem;
  }
  @keyframes shimmer{to{background-position:-200%}}

  .stats{
    display:flex;gap:1.5rem;justify-content:center;align-items:center;
    font-size:clamp(.85rem,2.2vw,1.1rem);margin-bottom:.6rem;
  }
  .stats span{
    background:rgba(255,255,255,.08);
    padding:.3rem .8rem;border-radius:8px;
    backdrop-filter:blur(4px);
  }
  .stats .label{opacity:.7;margin-right:.2rem}

  .btn{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;border:none;padding:.55rem 1.4rem;
    border-radius:10px;font-size:1rem;font-weight:600;
    cursor:pointer;transition:transform .15s,box-shadow .15s;
    box-shadow:0 4px 15px rgba(102,126,234,.4);
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.55)}
  .btn:active{transform:scale(.96)}

  /* ── Grid ── */
  .grid{
    display:grid;grid-template-columns:repeat(6,1fr);
    gap:clamp(4px,1vw,10px);
    max-width:620px;width:100%;
    perspective:1200px;margin-bottom:1rem;
  }

  /* ── Card ── */
  .card{
    width:100%;aspect-ratio:5/7;
    cursor:pointer;perspective:600px;
    -webkit-tap-highlight-color:transparent;
  }
  .card-inner{
    width:100%;height:100%;position:relative;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,1.5,.6,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card.matched .card-inner{animation:matchPop .5s ease forwards}
  @keyframes matchPop{
    0%{transform:rotateY(180deg) scale(1)}
    50%{transform:rotateY(180deg) scale(1.15)}
    100%{transform:rotateY(180deg) scale(1)}
  }

  .card-face{
    position:absolute;inset:0;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    font-size:clamp(1.4rem,4.5vw,2.4rem);
  }
  .card-back{
    background:linear-gradient(145deg,#4a4e8a,#2e3168);
    border:2px solid rgba(255,255,255,.12);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25);
  }
  .card-back::after{
    content:'?';font-size:clamp(1.2rem,3.5vw,2rem);
    font-weight:700;color:rgba(255,255,255,.25);
  }
  .card-front{
    background:linear-gradient(145deg,#fff,#e8e8f5);
    transform:rotateY(180deg);
    border:2px solid rgba(0,0,0,.08);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .card.matched .card-front{
    background:linear-gradient(145deg,#d4edda,#c3e6cb);
    border-color:rgba(40,200,64,.3);
  }

  /* ── Overlay ── */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .4s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay-box{
    background:linear-gradient(145deg,#1e1e3f,#2a2a5a);
    border:2px solid rgba(255,255,255,.1);
    border-radius:20px;padding:2.5rem 3rem;text-align:center;
    max-width:90vw;transform:scale(.8);transition:transform .4s;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .overlay.show .overlay-box{transform:scale(1)}
  .overlay-box h2{font-size:2rem;margin-bottom:.5rem}
  .overlay-box .trophy{font-size:4rem;margin-bottom:.5rem}
  .overlay-box p{margin:.6rem 0;font-size:1.1rem;opacity:.85}
  .overlay-box .btn{margin-top:1.2rem}

  /* ── Confetti ── */
  .confetti-piece{
    position:fixed;top:-10px;width:10px;height:10px;
    z-index:200;pointer-events:none;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{transform:translateY(110vh) rotate(720deg);opacity:0}
  }

  @media(max-width:480px){
    .grid{gap:4px}
    .card-face{border-radius:6px}
    header{margin-bottom:.5rem}
  }
</style>
</head>
<body>

<header>
  <h1>🧠 Memory</h1>
  <div class="stats">
    <span><span class="label">⏱</span><b id="timer">0</b>&nbsp;s</span>
    <span><span class="label">🎯</span><b id="moves">0</b>&nbsp;Züge</span>
    <span><span class="label">✅</span><b id="pairs">0</b>/18</span>
  </div>
  <button class="btn" id="restartBtn">🔄 Neustart</button>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="trophy">🏆</div>
    <h2>Gewonnen!</h2>
    <p id="resultText"></p>
    <button class="btn" onclick="init()">🔄 Nochmal spielen</button>
  </div>
</div>

<script>
const EMOJIS = ['🐶','🐱','🦁','🐸','🐼','🦊','🐷','🐮','🐔','🐴','🦄','🐙','🦋','🐢','🦀','🦉','🐳','🐝'];

let firstCard = null, lock = false, moves = 0, pairsFound = 0;
let seconds = 0, timerId = null, started = false;
let mismatchTimeout = null;

const grid       = document.getElementById('grid');
const timerEl    = document.getElementById('timer');
const movesEl    = document.getElementById('moves');
const pairsEl    = document.getElementById('pairs');
const overlay    = document.getElementById('overlay');
const resultText = document.getElementById('resultText');

/* ── Web-Audio-Sounds ── */
const actx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur, vol = .15, type = 'sine') {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function sndFlip()     { beep(600, .12, .1) }
function sndFlipBack() { beep(400, .1,  .08) }
function sndMatch()    { beep(523,.15,.12); setTimeout(()=>beep(659,.15,.12),100); setTimeout(()=>beep(784,.2,.12),200) }
function sndFail()     { beep(220,.25,.1,'sawtooth') }
function sndWin()      { [523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,.12),i*120)) }

/* ── Fisher-Yates Shuffle ── */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── Init / Restart ── */
function init() {
  if (actx.state === 'suspended') actx.resume();
  const deck = shuffle([...EMOJIS, ...EMOJIS]);
  firstCard = null; lock = false; moves = 0; pairsFound = 0;
  seconds = 0; started = false;
  if (timerId) clearInterval(timerId);
  if (mismatchTimeout) clearTimeout(mismatchTimeout);
  timerEl.textContent = '0';
  movesEl.textContent = '0';
  pairsEl.textContent = '0';
  overlay.classList.remove('show');
  document.querySelectorAll('.confetti-piece').forEach(e => e.remove());
  grid.innerHTML = '';

  deck.forEach(emoji => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-back"></div>' +
        '<div class="card-face card-front">' + emoji + '</div>' +
      '</div>';
    card.addEventListener('click', () => flip(card));
    grid.appendChild(card);
  });
}

/* ── Timer ── */
function startTimer() {
  if (started) return;
  started = true;
  timerId = setInterval(() => {
    seconds++;
    timerEl.textContent = seconds;
  }, 1000);
}

/* ── Karten zurückdrehen ── */
function flipBackAll() {
  document.querySelectorAll('.card.flipped:not(.matched)')
    .forEach(c => c.classList.remove('flipped'));
}

/* ── Kern-Logik ── */
function flip(card) {
  if (card.classList.contains('matched')) return;

  if (card.classList.contains('flipped')) {
    if (firstCard === card) {
      card.classList.remove('flipped');
      firstCard = null;
      sndFlipBack();
    } else if (lock) {
      if (mismatchTimeout) clearTimeout(mismatchTimeout);
      flipBackAll();
      lock = false;
      sndFlipBack();
    }
    return;
  }

  if (lock) return;

  startTimer();
  sndFlip();
  card.classList.add('flipped');

  if (!firstCard) {
    firstCard = card;
    return;
  }

  moves++;
  movesEl.textContent = moves;

  const first  = firstCard;
  firstCard = null;
  const second = card;

  if (first.dataset.emoji === second.dataset.emoji) {
    setTimeout(() => {
      first.classList.add('matched');
      second.classList.add('matched');
      sndMatch();
      pairsFound++;
      pairsEl.textContent = pairsFound;
      if (pairsFound === 18) win();
    }, 350);
  } else {
    lock = true;
    setTimeout(() => sndFail(), 300);
    mismatchTimeout = setTimeout(() => {
      first.classList.remove('flipped');
      second.classList.remove('flipped');
      lock = false;
    }, 900);
  }
}

/* ── Win ── */
function win() {
  if (timerId) clearInterval(timerId);
  sndWin();
  resultText.innerHTML = '⏱ ' + seconds + ' Sekunden &nbsp;·&nbsp; 🎯 ' + moves + ' Züge';
  setTimeout(() => overlay.classList.add('show'), 600);
  confetti();
}

/* ── Confetti ── */
function confetti() {
  const colors = ['#f5c518','#ff6b6b','#667eea','#764ba2','#48c774','#ff9f43'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    el.style.width = el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

document.getElementById('restartBtn').addEventListener('click', init);
init();

/* ── Service Worker Registrierung ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => console.warn('SW Registrierung fehlgeschlagen:', err));
  });
}
</script>
</body>
</html>
